<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Realtime Chat</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="chat">

  <div class="header">
    <h2>💬 Realtime Chat</h2>

    <div id="users">
      Online Users: 0
    </div>

    <button onclick="toggleDark()">
      🌙
    </button>
  </div>

  <ul id="messages"></ul>

  <p id="typing"></p>

  <div class="input">

    <input
      id="username"
      placeholder="Name"
      autocomplete="off"
    >

    <input
      id="msg"
      placeholder="Type message..."
      autocomplete="off"
      onkeypress="checkEnter(event)"
    >

    <button onclick="send()">
      Send
    </button>

  </div>

</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="script.js"></script>

</body>
</html>
